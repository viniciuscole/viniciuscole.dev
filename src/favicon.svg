<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="vc">
  <!-- Marca autoral: "vc" em monoespacada, no verde da paleta VGA de 16 cores
       (o mesmo elo visual com o projeto em assembly usado nos tokens de cor).
       Sem arquivo de fonte: `monospace` resolve para a fonte do sistema. -->
  <rect width="32" height="32" rx="4" fill="#0f1115"/>
  <text x="16" y="22" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" font-weight="700" fill="#33cc33">vc</text>
</svg>
